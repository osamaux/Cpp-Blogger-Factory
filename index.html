<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Osama Code Test</title>
    <link rel="stylesheet" href="factory.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/JSCPP/2.0.4/JSCPP.min.js"></script>
</head>
<body style="background: #1e1e1e; color: white; padding: 20px; direction: rtl;">

    <div id="factory-app">
        <div class="header">🛠️ مصنع أسامة (النسخة المحلية 100%)</div>
        
        <textarea id="cppInput" style="width:100%; height:300px; background:#252526; color:#fff; font-family:monospace; padding:10px; direction:ltr; text-align: left; border: 1px solid #444;">
#include <iostream>
using namespace std;
int main() {
    cout << "Success! No servers, no network errors!" << endl;
    return 0;
}
        </textarea>

        <button id="runBtn" onclick="runCodeNow()" style="width:100%; padding:15px; background:#e67e22; color:white; border:none; cursor:pointer; margin-top:15px; font-weight:bold; border-radius: 8px;">تشغيل المحرك الداخلي (Run)</button>

        <div id="outputConsole" style="background:#000; color:#4ec9b0; padding:15px; margin-top:15px; min-height:100px; border-radius:5px; font-family:monospace; white-space: pre-wrap; border: 1px solid #333;">بانتظار الأوامر...</div>
    </div>

   <script src="https://unpkg.com/jscpp@2.0.4/dist/JSCPP.min.js"></script>
</body>
</html>
